<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fund Explorer</title><style>
:root{color-scheme:light dark;--bg:#f4f7f7;--card:#fff;--text:#172022;--muted:#667276;--line:#d8e1e2;--accent:#16715d;--soft:#e7f3ef;--warn:#a86200}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto;padding:26px 18px 60px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{padding:9px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none;font-weight:750}.nav a.active,.nav a:hover{background:var(--soft);color:var(--accent)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.muted{color:var(--muted)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.filters input,.filters select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:transparent;color:inherit}.tableWrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}a.fund{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}.auto{color:#087c5d;font-weight:700}.fallback_manual{color:#b26a00;font-weight:700}.manual{color:var(--muted);font-weight:700}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}@media(prefers-color-scheme:dark){:root{--bg:#101718;--card:#182123;--text:#edf3f1;--muted:#9eacab;--line:#334044;--accent:#66d1b5;--soft:#203532}}

/* shared-theme-v20 */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f7f7;--card:#fff;--text:#172022;--muted:#667276;--line:#d8e1e2;
  --accent:#16715d;--accent2:#0f5b4b;--soft:#e7f3ef;--warn:#a86200;
  --brand:#0f766e;--brand-strong:#0b5f59;--brand-soft:#e8f6f3;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101718;--card:#182123;--text:#edf3f1;--muted:#9eacab;--line:#334044;
  --accent:#66d1b5;--accent2:#92e4cf;--soft:#203532;--warn:#e2ad5e;
  --brand:#64d6bd;--brand-strong:#8ee8d3;--brand-soft:#1f3c37;
}


/* fund-explorer-layout-v25 */
body main{max-width:1680px!important;padding-left:24px!important;padding-right:24px!important}
.fundCountV25{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 10px;color:var(--muted);font-size:13px}
.fundCountV25 strong{color:var(--text);font-size:14px}
.tableWrap{overflow-x:visible!important}
#fundExplorerTableV25{width:100%!important;min-width:0!important;table-layout:auto}
#fundExplorerTableV25 th,#fundExplorerTableV25 td{padding:10px 7px;font-size:13px}
#fundExplorerTableV25 th:nth-child(1),#fundExplorerTableV25 td:nth-child(1){width:42px;text-align:center;color:var(--muted)}
#fundExplorerTableV25 th:nth-child(2),#fundExplorerTableV25 td:nth-child(2){min-width:220px;text-align:left;white-space:normal}
#fundExplorerTableV25 th:nth-child(3),#fundExplorerTableV25 td:nth-child(3){min-width:135px;text-align:left;white-space:normal}
#fundExplorerTableV25 th:nth-child(4),#fundExplorerTableV25 td:nth-child(4){min-width:120px;white-space:normal}
#fundExplorerTableV25 th:nth-child(5),#fundExplorerTableV25 td:nth-child(5){min-width:90px;white-space:normal}
#fundExplorerTableV25 th:nth-child(6),#fundExplorerTableV25 td:nth-child(6){min-width:85px;white-space:normal}
#fundExplorerTableV25 th:nth-child(n+7),#fundExplorerTableV25 td:nth-child(n+7){white-space:nowrap}
@media(max-width:1100px){.tableWrap{overflow-x:auto!important}#fundExplorerTableV25{min-width:1180px!important}.fundCountV25{position:sticky;left:0}}

</style>
<style id="siteThemeV2">html[data-theme="light"]{color-scheme:light;--bg:#f4f7f7;--card:#fff;--text:#172022;--muted:#667276;--line:#d8e1e2;--accent:#16715d;--soft:#e7f3ef}html[data-theme="dark"]{color-scheme:dark;--bg:#101718;--card:#182123;--text:#edf3f1;--muted:#9eacab;--line:#334044;--accent:#66d1b5;--soft:#203532}.themeControl{display:inline-flex;align-items:center;gap:6px;margin-left:auto}.themeControl label{font-size:12px;color:var(--muted)}.themeControl select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
</style>

<style id="siteFinishV4Shared">html[data-theme="dark"] select,html[data-theme="dark"] option{background:#182123!important;color:#edf3f1!important}.backTopV4{position:fixed;right:22px;bottom:22px;z-index:80;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 14px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-weight:800;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:.16s}.backTopV4.show{opacity:1;pointer-events:auto;transform:none}@media(max-width:700px){.backTopV4{right:12px;bottom:12px}}</style>
</head><body><main><nav class="nav"><a href="./">Calculator</a><a class="active" href="./fund-explorer.html">Fund Explorer</a><a href="./discovery.html">Discovery Inbox</a><a href="./add-fund.html">Add Fund</a></nav><section class="card"><h1 style="margin-top:0">Fund Explorer</h1><p class="muted">Research the Shariah funds tracked by the calculator. Click any fund for its website, contact details and Shariah information.</p><div class="filters"><input id="q" placeholder="Search fund or manager"><select id="risk"><option value="">All risk levels</option></select><select id="bucket"><option value="">All account groups</option></select><select id="sort"><option value="name">Sort: Fund name</option><option value="fiveYear">Sort: 5Y return</option><option value="threeYear">Sort: 3Y return</option><option value="oneYear">Sort: 1Y return</option><option value="ter">Sort: TER</option></select></div></section><section class="card"><div class="fundCountV25"><strong id="fundCountV25">Loading funds…</strong><span id="fundTotalV25"></span></div><div class="tableWrap"><table id="fundExplorerTableV25"><thead><tr><th>#</th><th>Fund</th><th>Manager</th><th>Account</th><th>Fund status</th><th>Risk</th><th>1Y</th><th>3Y</th><th>5Y</th><th>10Y</th><th>TER</th><th>Data as at</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="13">Loading…</td></tr></tbody></table></div><p class="muted" id="generated"></p></section><script>
const $=id=>document.getElementById(id),pct=n=>n==null?'—':Number(n).toFixed(2)+'%';let feed={funds:[]},directory={funds:{}};function accountLabel(f){const d=(directory.funds||{})[f.id]||{},a=d.account_suitability;if(a==='Both')return'TFSA & Non-TFSA';if(a)return a;return f.bucket==='Watchlist'?'Not confirmed':(f.bucket||'—')}function render(){const q=$('q').value.toLowerCase().trim(),risk=$('risk').value,bucket=$('bucket').value,sort=$('sort').value;let arr=feed.funds.filter(f=>(!q||(f.name+' '+(f.manager||'')).toLowerCase().includes(q))&&(!risk||f.risk_level===risk)&&(!bucket||f.bucket===bucket));arr.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):(Number(b[sort]??-Infinity)-Number(a[sort]??-Infinity)));$('fundCountV25').textContent=`Showing ${arr.length} of ${feed.funds.length} funds`;$('fundTotalV25').textContent=arr.length===feed.funds.length?'Full list':'Filtered list';$('rows').innerHTML=arr.length?arr.map((f,i)=>`<tr><td>${i+1}</td><td><a class="fund" href="./fund-details.html?id=${encodeURIComponent(f.id)}">${f.name}</a></td><td>${f.manager||'—'}</td><td>${accountLabel(f)}</td><td>${f.bucket==='Watchlist'?'Watchlist':'Active'}</td><td>${f.risk_level||'—'}</td><td>${pct(f.oneYear)}</td><td>${pct(f.threeYear)}</td><td>${pct(f.fiveYear)}</td><td>${pct(f.tenYear)}</td><td>${pct(f.ter)}</td><td>${f.data_as_of||'—'}</td><td class="${f.update_status||''}">${f.update_status||'—'}</td></tr>`).join(''):'<tr><td colspan="13">No funds match these filters.</td></tr>'}
async function load(){const [r,d]=await Promise.all([fetch('./shariah-funds.json?ts='+Date.now(),{cache:'no-store'}),fetch('./fund-directory.json?ts='+Date.now(),{cache:'no-store'})]);feed=await r.json();directory=await d.json();const risks=[...new Set(feed.funds.map(f=>f.risk_level).filter(Boolean))].sort(),buckets=[...new Set(feed.funds.map(f=>f.bucket).filter(Boolean))].sort();$('risk').innerHTML+=[...risks].map(x=>`<option>${x}</option>`).join('');$('bucket').innerHTML+=[...buckets].map(x=>`<option>${x}</option>`).join('');$('generated').textContent='Feed generated: '+(feed.generated_at||'—');render()}['q','risk','bucket','sort'].forEach(id=>$(id).addEventListener('input',render));load();
</script></main><script id="siteThemeScriptV2">(function(){const saved=localStorage.getItem('shariahTheme')||'system';document.documentElement.dataset.theme=saved==='system'?'':saved;const nav=document.querySelector('.nav,.top');if(nav&&!document.getElementById('themeMode')){const w=document.createElement('span');w.className='themeControl';w.innerHTML='<label for="themeMode">Theme</label><select id="themeMode"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>';nav.appendChild(w);const s=w.querySelector('select');s.value=saved;s.onchange=()=>{localStorage.setItem('shariahTheme',s.value);document.documentElement.dataset.theme=s.value==='system'?'':s.value}}})();</script>

<script id="siteFinishV4SharedScript">(function(){if(document.getElementById('backTopV4'))return;const b=document.createElement('button');b.id='backTopV4';b.className='backTopV4';b.type='button';b.innerHTML='↑&nbsp; Back to Top';b.onclick=()=>scrollTo({top:0,behavior:'smooth'});document.body.appendChild(b);const show=()=>b.classList.toggle('show',scrollY>420);addEventListener('scroll',show,{passive:true});show()})();</script>

<script>
/* shared-theme-v20 */
(function(){
  const key='shariahTheme';
  const saved=localStorage.getItem(key)||'system';
  if(saved==='light'||saved==='dark') document.documentElement.dataset.theme=saved;
  else document.documentElement.removeAttribute('data-theme');

  // Theme is selected once for the whole application from the Calculator page.
  // Remove page-specific selectors from secondary pages so there is only one setting.
  document.querySelectorAll('#themeMode,.themeSelect').forEach(el=>{
    const parent=el.closest('label,.planTools,.themeControl,.theme-control');
    if(parent && /theme/i.test(parent.textContent||'')) parent.remove();
    else el.remove();
  });
})();
</script>

<!-- fund-explorer-layout-v25 -->
</body></html>
