name: Activate reviewed watchlist fund

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  activate:
    if: startsWith(github.event.issue.title, 'Activate tracked fund:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and activate watchlist fund
        run: python scripts/activate_watchlist.py
      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/funds.json
          git commit -m "Activate reviewed watchlist Shariah fund"
          git push origin HEAD:main
