name: Apply V32 calculator fixes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-v32-calculator-fixes.yml"
      - "scripts/pending_comments_v32.py"
      - "scripts/summary_fund_risk_v31.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apply-v32-calculator-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply V31 Step 6 risk column
        run: python scripts/summary_fund_risk_v31.py
      - name: Apply V32 pending changes
        run: python scripts/pending_comments_v32.py
      - name: Sync visible app version
        run: python scripts/pdf_name_reference_v16.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/fund-explorer.html docs/app-version.json
          if git diff --cached --quiet; then
            echo "No V32 changes to commit."
          else
            git commit -m "Apply V32 calculator and research UI fixes"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
