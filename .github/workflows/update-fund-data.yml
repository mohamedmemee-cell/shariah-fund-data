name: Update and publish Shariah fund data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fund-data.yml"
      - "scripts/**"
      - "sources/**"
      - "data/manual_values.json"
      - "docs/**"
      - "requirements.txt"
  schedule:
    - cron: "15 6 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shariah-fund-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add beginner-friendly calculator help
        run: python scripts/beginner_help.py
      - name: Add TER to beginner quick guide
        run: python scripts/add_ter_quick_guide.py
      - name: Link projection scenarios to portfolio builder
        run: python scripts/link_projection_scenarios.py
      - name: Link fund names to detail pages
        run: python scripts/link_fund_details.py
      - name: Make selected portfolio drive monthly plan
        run: python scripts/apply_selected_portfolio.py
      - name: Make Portfolio Builder first and align buttons
        run: python scripts/builder_first_layout.py
      - name: Run calculator QA
        run: python scripts/qa_calculator.py
      - name: Clean invalid legacy data before feed generation
        run: python scripts/preflight_data_cleanup.py
      - name: Update fund data
        run: python scripts/update_funds.py
      - name: Validate feed
        run: python scripts/validate_feed.py
      - name: Apply major V2 guided flow
        run: python scripts/major_v2_flow.py
      - name: Smooth projection slider
        run: python scripts/smooth_slider.py
      - name: Apply performance V3
        run: python scripts/performance_v3.py
      - name: Apply beginner-friendly UI polish
        run: python scripts/ui_polish_v1.py
      - name: Fix portfolio scenario sync
        run: python scripts/fix_scenario_sync.py
      - name: Simplify Add Fund confirmation flow
        run: python scripts/add_fund_beginner_flow.py
      - name: Fix Add Fund start button
        run: python scripts/add_fund_click_fix_v2.py
      - name: Apply plan summary, sharing and beginner controls
        run: python scripts/pending_batch_v1.py
      - name: Apply site-wide theme and guided-flow fixes
        run: python scripts/site_ui_v2.py
      - name: Apply Watchlist activation review UI
        run: python scripts/watchlist_activation_ui.py
      - name: Apply manual verification UI
        run: python scripts/manual_verification_ui.py
      - name: Apply final UX, PDF, graph and inception-date fixes
        run: python scripts/site_finish_v4.py
      - name: Apply clean defaults and PDF QR polish
        run: python scripts/site_finish_v5.py
      - name: Polish projected value summary cards
        run: python scripts/summary_projection_polish_v6.py
      - name: Apply calculator access-code gate
        run: python scripts/access_gate_v1.py
      - name: Set calculator master access code
        run: python scripts/access_gate_code_v2.py
      - name: Fix PDF projection cards and add fund contact details
        run: python scripts/pdf_projection_and_contacts_v7.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs sources/funds.json
          if git diff --cached --quiet; then
            echo "No fund data or calculator changes to commit."
          else
            git commit -m "Update Shariah fund data, performance and UI"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "Push failed after 3 attempts."; exit 1; fi
              git fetch origin main
              git reset --hard origin/main
              python scripts/beginner_help.py
              python scripts/add_ter_quick_guide.py
              python scripts/link_projection_scenarios.py
              python scripts/link_fund_details.py
              python scripts/apply_selected_portfolio.py
              python scripts/builder_first_layout.py
              python scripts/qa_calculator.py
              python scripts/preflight_data_cleanup.py
              python scripts/update_funds.py
              python scripts/validate_feed.py
              python scripts/major_v2_flow.py
              python scripts/smooth_slider.py
              python scripts/performance_v3.py
              python scripts/ui_polish_v1.py
              python scripts/fix_scenario_sync.py
              python scripts/add_fund_beginner_flow.py
              python scripts/add_fund_click_fix_v2.py
              python scripts/pending_batch_v1.py
              python scripts/site_ui_v2.py
              python scripts/watchlist_activation_ui.py
              python scripts/manual_verification_ui.py
              python scripts/site_finish_v4.py
              python scripts/site_finish_v5.py
              python scripts/summary_projection_polish_v6.py
              python scripts/access_gate_v1.py
              python scripts/access_gate_code_v2.py
              python scripts/pdf_projection_and_contacts_v7.py
              git add data docs sources/funds.json
              if git diff --cached --quiet; then break; fi
              git commit -m "Update Shariah fund data, performance and UI"
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
