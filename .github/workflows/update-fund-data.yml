name: Update and publish Shariah fund data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fund-data.yml"
      - "scripts/**"
      - "sources/**"
      - "data/manual_values.json"
      - "docs/**"
      - "requirements.txt"
  schedule:
    # Sundays at 06:15 UTC = 08:15 South Africa time
    - cron: "15 6 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shariah-fund-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add beginner-friendly calculator help
        run: python scripts/beginner_help.py

      - name: Add TER to beginner quick guide
        run: python scripts/add_ter_quick_guide.py

      - name: Link projection scenarios to portfolio builder
        run: python scripts/link_projection_scenarios.py

      - name: Link fund names to detail pages
        run: python scripts/link_fund_details.py

      - name: Make selected portfolio drive monthly plan
        run: python scripts/apply_selected_portfolio.py

      - name: Run calculator QA
        run: python scripts/qa_calculator.py

      - name: Update fund data
        run: python scripts/update_funds.py

      - name: Validate feed
        run: python scripts/validate_feed.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/shariah-funds.json docs/index.html
          if git diff --cached --quiet; then
            echo "No fund data or calculator changes to commit."
          else
            git commit -m "Update Shariah fund data and calculator flow"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after 3 attempts."
                exit 1
              fi
              echo "main changed during this run; rebuilding from latest main (attempt $attempt)."
              git fetch origin main
              git reset --hard origin/main
              python scripts/beginner_help.py
              python scripts/add_ter_quick_guide.py
              python scripts/link_projection_scenarios.py
              python scripts/link_fund_details.py
              python scripts/apply_selected_portfolio.py
              python scripts/qa_calculator.py
              python scripts/update_funds.py
              python scripts/validate_feed.py
              git add data docs/shariah-funds.json docs/index.html
              if git diff --cached --quiet; then
                echo "Latest main already contains equivalent generated data."
                break
              fi
              git commit -m "Update Shariah fund data and calculator flow"
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
