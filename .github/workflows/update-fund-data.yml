name: Update and publish Shariah fund data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fund-data.yml"
      - "scripts/**"
      - "sources/**"
      - "data/manual_values.json"
      - "docs/**"
      - "requirements.txt"
  schedule:
    - cron: "15 6 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shariah-fund-data-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add beginner-friendly calculator help
        run: python scripts/beginner_help.py
      - name: Add TER to beginner quick guide
        run: python scripts/add_ter_quick_guide.py
      - name: Link projection scenarios to portfolio builder
        run: python scripts/link_projection_scenarios.py
      - name: Link fund names to detail pages
        run: python scripts/link_fund_details.py
      - name: Make selected portfolio drive monthly plan
        run: python scripts/apply_selected_portfolio.py
      - name: Make Portfolio Builder first and align buttons
        run: python scripts/builder_first_layout.py
      - name: Run calculator QA
        run: python scripts/qa_calculator.py
      - name: Clean invalid legacy data before feed generation
        run: python scripts/preflight_data_cleanup.py
      - name: Add Alexforbes Shariah Manager Watch universe
        run: python scripts/alexforbes_survey_seed_v24.py
      - name: Update fund data
        run: python scripts/update_funds.py
      - name: Apply manually verified values to live fund data
        run: python scripts/manual_verified_cards_v23.py
      - name: Validate feed
        run: python scripts/validate_feed.py
      - name: Apply major V2 guided flow
        run: python scripts/major_v2_flow.py
      - name: Smooth projection slider
        run: python scripts/smooth_slider.py
      - name: Apply performance V3
        run: python scripts/performance_v3.py
      - name: Apply beginner-friendly UI polish
        run: python scripts/ui_polish_v1.py
      - name: Fix portfolio scenario sync
        run: python scripts/fix_scenario_sync.py
      - name: Simplify Add Fund confirmation flow
        run: python scripts/add_fund_beginner_flow.py
      - name: Fix Add Fund start button
        run: python scripts/add_fund_click_fix_v2.py
      - name: Apply plan summary, sharing and beginner controls
        run: python scripts/pending_batch_v1.py
      - name: Apply site-wide theme and guided-flow fixes
        run: python scripts/site_ui_v2.py
      - name: Apply Watchlist activation review UI
        run: python scripts/watchlist_activation_ui.py
      - name: Apply manual verification UI
        run: python scripts/manual_verification_ui.py
      - name: Apply final UX, PDF, graph and inception-date fixes
        run: python scripts/site_finish_v4.py
      - name: Apply clean defaults and PDF QR polish
        run: python scripts/site_finish_v5.py
      - name: Polish projected value summary cards
        run: python scripts/summary_projection_polish_v6.py
      - name: Remove calculator access-code gate for now
        run: python scripts/remove_access_gate_v1.py
      - name: Fix PDF projection cards and add fund contact details
        run: python scripts/pdf_projection_and_contacts_v7.py
      - name: Keep final portfolio risk mix consistent
        run: python scripts/risk_mix_consistency_v8.py
      - name: Explain Step 6 risk mix differences
        run: python scripts/step6_risk_explanation_v9.py
      - name: Add name or reference to shared plans
        run: python scripts/plan_name_reference_v10.py
      - name: Fix account suitability and inception display
        run: python scripts/account_suitability_inception_v11.py
      - name: Standardise manager risk labels into calculator bands
        run: python scripts/risk_normalisation_v12.py
      - name: Make Shariah source editable in verification flow
        run: python scripts/editable_shariah_source_v13.py
      - name: Add small calculator version badge
        run: python scripts/version_badge_v14.py
      - name: Fix version badge and Fund Explorer account display
        run: python scripts/live_sync_fixes_v15.py
      - name: Ensure name/reference appears in PDF output
        run: python scripts/pdf_name_reference_v16.py
      - name: Ensure Discovery Inbox navigation
        run: python scripts/discovery_nav_v17.py
      - name: Add Discovery Inbox review and Add Fund handoff
        run: python scripts/discovery_review_add_v18.py
      - name: Add manual Search For controls
        run: python scripts/discovery_manual_search_ui_v19.py
      - name: Apply one shared application theme
        run: python scripts/shared_theme_v20.py
      - name: Show GitHub return status for Search and Add Fund
        run: python scripts/github_return_status_v21.py
      - name: Fix Portfolio Builder activation and GitHub return status
        run: python scripts/activation_return_status_v22.py
      - name: Improve Fund Explorer width, numbering and counts
        run: python scripts/fund_explorer_layout_v25.py
      - name: Apply guided calculator flow and bulk Watchlist pass
        run: python scripts/pending_release_v28.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs sources/funds.json
          if git diff --cached --quiet; then
            echo "No fund data or calculator changes to commit."
          else
            git commit -m "Update Shariah fund data, performance and UI"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "Push failed after 3 attempts."; exit 1; fi
              git fetch origin main
              git reset --hard origin/main
              python scripts/beginner_help.py
              python scripts/add_ter_quick_guide.py
              python scripts/link_projection_scenarios.py
              python scripts/link_fund_details.py
              python scripts/apply_selected_portfolio.py
              python scripts/builder_first_layout.py
              python scripts/qa_calculator.py
              python scripts/preflight_data_cleanup.py
              python scripts/alexforbes_survey_seed_v24.py
              python scripts/update_funds.py
              python scripts/manual_verified_cards_v23.py
              python scripts/validate_feed.py
              python scripts/major_v2_flow.py
              python scripts/smooth_slider.py
              python scripts/performance_v3.py
              python scripts/ui_polish_v1.py
              python scripts/fix_scenario_sync.py
              python scripts/add_fund_beginner_flow.py
              python scripts/add_fund_click_fix_v2.py
              python scripts/pending_batch_v1.py
              python scripts/site_ui_v2.py
              python scripts/watchlist_activation_ui.py
              python scripts/manual_verification_ui.py
              python scripts/site_finish_v4.py
              python scripts/site_finish_v5.py
              python scripts/summary_projection_polish_v6.py
              python scripts/remove_access_gate_v1.py
              python scripts/pdf_projection_and_contacts_v7.py
              python scripts/risk_mix_consistency_v8.py
              python scripts/step6_risk_explanation_v9.py
              python scripts/plan_name_reference_v10.py
              python scripts/account_suitability_inception_v11.py
              python scripts/risk_normalisation_v12.py
              python scripts/editable_shariah_source_v13.py
              python scripts/version_badge_v14.py
              python scripts/live_sync_fixes_v15.py
              python scripts/pdf_name_reference_v16.py
              python scripts/discovery_nav_v17.py
              python scripts/discovery_review_add_v18.py
              python scripts/discovery_manual_search_ui_v19.py
              python scripts/shared_theme_v20.py
              python scripts/github_return_status_v21.py
              python scripts/activation_return_status_v22.py
              python scripts/fund_explorer_layout_v25.py
              python scripts/pending_release_v28.py
              git add data docs sources/funds.json
              if git diff --cached --quiet; then break; fi
              git commit -m "Update Shariah fund data, performance and UI"
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
