name: Apply candidate review verification

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  review:
    if: startsWith(github.event.issue.title, 'Review candidate data:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply review
        run: python scripts/candidate_manual_review_v34.py
      - name: Keep Add Fund UI current
        run: |
          python scripts/add_fund_status_sync_v33.py
          python scripts/discovery_review_workspace_v34.py
      - name: Commit review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates docs/candidates docs/add-fund.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply candidate manual review"
            git push origin HEAD:main
          fi
      - name: Close review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
