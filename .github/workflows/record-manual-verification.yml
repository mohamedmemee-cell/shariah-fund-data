name: Record manually verified fund information

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  verify:
    if: startsWith(github.event.issue.title, 'Verify fund data:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record verified information
        run: python scripts/record_manual_verification.py
      - name: Commit verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/funds.json data/manual_values.json docs/fund-directory.json
          git commit -m "Record manually verified fund information"
          git push origin HEAD:main
